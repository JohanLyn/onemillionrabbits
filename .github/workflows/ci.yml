# Builds the game and plays it headlessly (laptop and phone) on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    # pinned: ubuntu-latest moved to 26.04, which this Playwright version can't install browsers on yet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Smoke test (laptop)
        run: npm run smoke -- --out shots
      - name: Smoke test (phone)
        run: npm run smoke -- --mobile --out shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots/
          if-no-files-found: ignore
